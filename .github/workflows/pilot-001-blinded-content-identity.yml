name: pilot-001-blinded-content-identity

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  content-identity-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .

    steps:
      - name: Checkout exact Fast-CAT revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Bind exact checkout
        run: |
          checked_out="$(git rev-parse HEAD)"
          echo "FASTCAT_CHECKED_OUT_SHA=$checked_out" >> "$GITHUB_ENV"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$checked_out" = "${{ github.event.pull_request.head.sha }}"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate exact content identity bytes and protocol linkage
        run: |
          python -m json.tool experiments/pilot_001/blinded_review_content_identity.json >/dev/null
          test "$(sha256sum experiments/pilot_001/blinded_review_content_identity.json | cut -d' ' -f1)" = "87877d69e5fcfd44433b93106740ef641c320a8037b06aefe281fff9179378fd"
          python - <<'PY'
          import json
          i=json.load(open('experiments/pilot_001/blinded_review_content_identity.json'))
          p=json.load(open('experiments/pilot_001/independent_review_submission_protocol.json'))
          assert i['schema']=='Fast-CAT/PILOT-001/blinded-review-content-identity/v1.0'
          assert i['canonical_package']['payload_file_count']==53
          assert i['canonical_package']['package_file_count_including_manifest']==54
          assert i['canonical_package']['package_manifest_file_sha256']=='85bf6a190377a304b607bd611cd7d9476e521b98682286f4d9cfb47d5878e3e4'
          assert i['canonical_package']['files_payload_sha256']=='2a550d1d32fff07757c6838f224a63fa5d87a00017b4dcc110154bd75fd99513'
          assert i['original_transport']['artifact_zip_sha256']=='ee86e46ab1979d5836a96788106e3e2f809268f6cbe7ccf1c6b328478e6f3f2f'
          assert i['original_transport']['identity_role'].startswith('historical transport provenance')
          assert i['exact_content_rules']['outer_zip_byte_identity_required'] is False
          assert i['exact_content_rules']['repacked_transport_allowed_only_if_canonical_package_content_matches'] is True
          assert p['schema']=='Fast-CAT/PILOT-001/independent-review-submission-protocol/v1.2'
          assert p['expected_blinded_package']['content_identity_file_sha256']=='87877d69e5fcfd44433b93106740ef641c320a8037b06aefe281fff9179378fd'
          assert p['expected_blinded_package']['original_transport_provenance']['admission_authority'] is False
          print('DURABLE_CONTENT_IDENTITY_STATIC = PASS')
          print('OUTER_ZIP_BYTE_IDENTITY_REQUIRED = FALSE')
          PY

      - name: Compile and test durable identity and reviewer binding
        run: |
          python -m py_compile \
            fastcat/blinded_package_identity.py \
            fastcat/review_submission_binding.py \
            fastcat/bound_review_ingestion.py \
            fastcat/reviewer_collection.py \
            scripts/verify_blinded_package_content.py \
            scripts/verify_independent_action_review_v1_2.py
          python -m unittest \
            tests.test_blinded_package_identity \
            tests.test_review_submission_binding \
            tests.test_bound_review_ingestion \
            tests.test_reviewer_collection \
            -v

      - name: Assert claim ceiling remains closed
        run: |
          python - <<'PY'
          import json
          i=json.load(open('experiments/pilot_001/blinded_review_content_identity.json'))
          assert i['independent_frame_level_estimate_established'] is False
          assert 'EAD103/EAD104' in i['claim_ceiling']
          assert 'mimicry' in i['claim_ceiling']
          assert 'INDEPENDENT_FRAME_LEVEL_ESTIMATE' in i['claim_ceiling']
          print('DURABLE_IDENTITY_BIOLOGICAL_CLAIM_PROMOTION = FALSE')
          PY

  historical-origin-bootstrap:
    if: github.event_name == 'pull_request' && github.head_ref == 'research/pilot-001-durable-review-package-v1-2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact Fast-CAT revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Bind exact checkout
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download exact still-live historical artifact
        run: |
          mkdir -p artifacts/blinded_content_identity
          curl --fail --location --retry 3 \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9032245626/zip" \
            --output artifacts/blinded_content_identity/original.zip
          echo "ee86e46ab1979d5836a96788106e3e2f809268f6cbe7ccf1c6b328478e6f3f2f  artifacts/blinded_content_identity/original.zip" | sha256sum --check

      - name: Bootstrap durable identity from exact original transport
        run: |
          python scripts/verify_blinded_package_content.py \
            --identity experiments/pilot_001/blinded_review_content_identity.json \
            --zip artifacts/blinded_content_identity/original.zip \
            --out artifacts/blinded_content_identity/origin_verification.json
          python - <<'PY'
          import json
          r=json.load(open('artifacts/blinded_content_identity/origin_verification.json'))
          assert r['status']=='EXACT_CANONICAL_CONTENT_MATCH'
          assert r['verified_payload_files']==53
          assert r['transport_zip_sha256']=='ee86e46ab1979d5836a96788106e3e2f809268f6cbe7ccf1c6b328478e6f3f2f'
          assert r['original_transport_match'] is True
          assert r['content_identity_file_sha256']=='87877d69e5fcfd44433b93106740ef641c320a8037b06aefe281fff9179378fd'
          assert r['independent_frame_level_estimate_established'] is False
          print('HISTORICAL_ORIGIN_BOOTSTRAP = EXACT_CANONICAL_CONTENT_MATCH')
          PY

      - name: Repack identical canonical content into byte-distinct transport
        run: |
          python - <<'PY'
          import zipfile
          src='artifacts/blinded_content_identity/original.zip'
          dst='artifacts/blinded_content_identity/repacked.zip'
          with zipfile.ZipFile(src) as zin, zipfile.ZipFile(dst,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=1) as zout:
              for name in zin.namelist():
                  zout.writestr(name,zin.read(name))
          PY
          test "$(sha256sum artifacts/blinded_content_identity/repacked.zip | cut -d' ' -f1)" != "ee86e46ab1979d5836a96788106e3e2f809268f6cbe7ccf1c6b328478e6f3f2f"
          python scripts/verify_blinded_package_content.py \
            --identity experiments/pilot_001/blinded_review_content_identity.json \
            --zip artifacts/blinded_content_identity/repacked.zip \
            --out artifacts/blinded_content_identity/repacked_verification.json
          python - <<'PY'
          import json
          r=json.load(open('artifacts/blinded_content_identity/repacked_verification.json'))
          assert r['status']=='EXACT_CANONICAL_CONTENT_MATCH'
          assert r['verified_payload_files']==53
          assert r['original_transport_match'] is False
          print('BYTE_DISTINCT_REPACKED_TRANSPORT = EXACT_CANONICAL_CONTENT_MATCH')
          PY

      - name: Upload compact origin bootstrap receipts
        uses: actions/upload-artifact@v4
        with:
          name: pilot-001-blinded-content-identity-origin-bootstrap
          path: |
            artifacts/blinded_content_identity/origin_verification.json
            artifacts/blinded_content_identity/repacked_verification.json
          if-no-files-found: error
          retention-days: 30
