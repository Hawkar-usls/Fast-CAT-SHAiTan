name: pilot-001-landmark-probe

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hugging-landmark-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: .
      FASTCAT_BACKEND_COMMIT: 9759bcbec55ea93c1f42745abd0baf0f8a4d57dd
      FASTCAT_SOURCE_ID: commons_hugging_2019

    steps:
      - name: Checkout exact Fast-CAT revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install media and Linux desktop dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            ffmpeg \
            ninja-build \
            libgtk-3-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            xvfb
          python -m pip install --upgrade pip
          python -m pip install pillow==11.3.0

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch frozen hugging source
        run: python scripts/fetch_open_video.py commons_hugging_2019

      - name: Build exact sampled-frame review ledger
        run: |
          python scripts/build_frame_ledger.py \
            --source-id commons_hugging_2019 \
            --video "data/raw/commons_hugging_2019/Two cats holding each other and hugging.webm" \
            --step-frames 10 \
            --out-dir artifacts/landmark_probe/frame_review

      - name: Independently replay sampled-frame pixels
        run: |
          python scripts/verify_frame_ledger.py \
            --source-id commons_hugging_2019 \
            --video "data/raw/commons_hugging_2019/Two cats holding each other and hugging.webm" \
            --ledger artifacts/landmark_probe/frame_review/frame_ledger.json \
            --frame-dir artifacts/landmark_probe/frame_review/frames \
            --out artifacts/landmark_probe/frame_review/verifier.json

      - name: Clone exact external 48-landmark backend
        run: |
          mkdir -p external
          git clone --filter=blob:none https://github.com/hugocornellier/cat_detection.git external/cat_detection
          git -C external/cat_detection fetch --depth=1 origin "$FASTCAT_BACKEND_COMMIT"
          git -C external/cat_detection checkout --detach "$FASTCAT_BACKEND_COMMIT"
          test "$(git -C external/cat_detection rev-parse HEAD)" = "$FASTCAT_BACKEND_COMMIT"
          echo "BACKEND_TREE=$(git -C external/cat_detection rev-parse HEAD^{tree})" >> "$GITHUB_ENV"

      - name: Cache external OpenCV native build
        uses: actions/cache@v4
        with:
          path: external/cat_detection/example/.dart_tool/hooks_runner/shared
          key: fastcat-cat-detection-linux-${{ env.FASTCAT_BACKEND_COMMIT }}

      - name: Install pinned backend dependencies
        working-directory: external/cat_detection/example
        run: flutter pub get

      - name: Inject Fast-CAT integration probe
        run: |
          cp tools/fastcat_landmark_probe_test.dart \
            external/cat_detection/example/integration_test/fastcat_probe_test.dart

      - name: Run pinned candidate 48-landmark probe
        env:
          FASTCAT_INPUT_DIR: ${{ github.workspace }}/artifacts/landmark_probe/frame_review/frames
          FASTCAT_OUT: ${{ github.workspace }}/artifacts/landmark_probe/raw_landmark_probe.json
        working-directory: external/cat_detection/example
        run: |
          set +e
          xvfb-run flutter test integration_test/fastcat_probe_test.dart -d linux --timeout 1800s \
            2>&1 | tee "$GITHUB_WORKSPACE/artifacts/landmark_probe/flutter_probe.log"
          flutter_status=${PIPESTATUS[0]}
          set -e
          test -s "$GITHUB_WORKSPACE/artifacts/landmark_probe/raw_landmark_probe.json"
          if grep -q "Some tests failed" "$GITHUB_WORKSPACE/artifacts/landmark_probe/flutter_probe.log"; then
            exit 1
          fi
          if ! grep -qE "tests? passed|All tests passed" "$GITHUB_WORKSPACE/artifacts/landmark_probe/flutter_probe.log"; then
            echo "No Flutter success summary; original exit=$flutter_status"
            exit 1
          fi
          echo "Flutter probe result accepted from test summary; original exit=$flutter_status"

      - name: Normalize structure and sampled identity candidates
        run: |
          python scripts/normalize_landmark_probe.py \
            --raw-probe artifacts/landmark_probe/raw_landmark_probe.json \
            --frame-ledger artifacts/landmark_probe/frame_review/frame_ledger.json \
            --frame-dir artifacts/landmark_probe/frame_review/frames \
            --out-dir artifacts/landmark_probe/candidate

      - name: Freeze exact backend and result receipt
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path('.').resolve()
          ext = root / 'external' / 'cat_detection'
          out = root / 'artifacts' / 'landmark_probe' / 'backend_receipt.json'
          def sha(path):
              h = hashlib.sha256()
              with open(path, 'rb') as f:
                  for block in iter(lambda: f.read(1024*1024), b''):
                      h.update(block)
              return h.hexdigest()
          def first(cmd):
              return subprocess.check_output(cmd, text=True).splitlines()[0]
          receipt = {
              'schema': 'Fast-CAT/PILOT-001/landmark-backend-receipt/v1.0',
              'fastcat_head_sha': os.environ['GITHUB_SHA'],
              'backend_repository': 'hugocornellier/cat_detection',
              'backend_commit': os.environ['FASTCAT_BACKEND_COMMIT'],
              'backend_tree': os.environ['BACKEND_TREE'],
              'license_file_sha256': sha(ext / 'LICENSE'),
              'pubspec_sha256': sha(ext / 'pubspec.yaml'),
              'model_assets': {
                  'cat_face_localizer.tflite': sha(ext / 'assets/models/cat_face_localizer.tflite'),
                  'cat_face_landmarks_full.tflite': sha(ext / 'assets/models/cat_face_landmarks_full.tflite'),
              },
              'fastcat_probe_test_sha256': sha(root / 'tools/fastcat_landmark_probe_test.dart'),
              'frame_ledger_sha256': sha(root / 'artifacts/landmark_probe/frame_review/frame_ledger.json'),
              'frame_verifier_sha256': sha(root / 'artifacts/landmark_probe/frame_review/verifier.json'),
              'raw_landmark_probe_sha256': sha(root / 'artifacts/landmark_probe/raw_landmark_probe.json'),
              'candidate_normalization_sha256': sha(root / 'artifacts/landmark_probe/candidate/candidate_normalization.json'),
              'flutter_version_first_line': first(['flutter', '--version']),
              'claim_ceiling': 'Pinned backend execution receipt only. External candidate landmarks are not admitted ground truth.'
          }
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Upload landmark candidate review pack
        uses: actions/upload-artifact@v4
        with:
          name: pilot-001-hugging-landmark-candidate
          path: artifacts/landmark_probe
          if-no-files-found: error
          retention-days: 30
